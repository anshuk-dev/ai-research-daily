name: AI Research Daily Intelligence Brief

on:
  schedule:
    # Runs daily at 07:30 AM IST (02:00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual run from GitHub UI anytime

permissions:
  contents: write

jobs:
  ai-daily-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚡ Run AI Daily Research Briefing
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL || 'anshu.airesearch@gmail.com' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python daily_brief.py

      - name: 💾 Commit and Push Updated Archive & History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ai_news_history.json README.md
          git diff --staged --quiet || (git commit -m "Auto-update: Daily AI research briefing [skip ci]" && git push)
